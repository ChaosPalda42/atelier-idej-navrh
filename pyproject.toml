[project]
name = "atelier-idej"
version = "0.1.0"
description = "Navrh noveho webu pro Atelier Idej s.r.o."
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pillow>=10.0",
    "fonttools>=4.50",
    "pypdf>=5.0",
    "ezdxf>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
